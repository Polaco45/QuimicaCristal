<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo redondeado naranja Cristal -->
  <rect x="0" y="0" width="100" height="100" rx="20" ry="20" fill="#FF9C00"/>

  <!-- Robot face (simple) -->
  <rect x="20" y="25" width="60" height="55" rx="8" ry="8" fill="white" opacity="0.95"/>

  <!-- Eyes -->
  <circle cx="38" cy="48" r="6" fill="#FF9C00"/>
  <circle cx="62" cy="48" r="6" fill="#FF9C00"/>
  <circle cx="38" cy="48" r="2" fill="white"/>
  <circle cx="62" cy="48" r="2" fill="white"/>

  <!-- Mouth (smile) -->
  <path d="M 38 64 Q 50 72 62 64" stroke="#FF9C00" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="50" y1="25" x2="50" y2="15" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="13" r="3" fill="white"/>
</svg>
